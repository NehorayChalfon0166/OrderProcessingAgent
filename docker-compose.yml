version: "3.9"

services:
  dashboard:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - ./order_agent.db:/app/order_agent.db
      - ./restaurants.json:/app/restaurants.json
      - ./menus:/app/menus
      - ./orders:/app/orders
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - API_TOKEN=${API_TOKEN:?required}
      - DB_PATH=/app/order_agent.db
      - RESTAURANTS_PATH=/app/restaurants.json
      - ORDERS_DIR=/app/orders
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    command: ["python", "main.py", "dashboard", "--port", "8081"]

