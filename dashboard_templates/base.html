<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1117">
    <title>{% block title %}Dashboard{% endblock %} — OrderBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="dashboard-layout">

        <!-- Mobile toggle button -->
        <button class="mobile-toggle" onclick="document.body.classList.toggle('sidebar-open')" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">🤖</div>
                <div class="brand-text">
                    <span class="brand-name">OrderBot</span>
                    <span class="brand-sub">Admin Dashboard</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="/" class="nav-item" data-path="/">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Overview</span>
                </a>
                <a href="/orders" class="nav-item" data-path="/orders">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">Orders</span>
                </a>
                <a href="/sessions" class="nav-item" data-path="/sessions">
                    <span class="nav-icon">💬</span>
                    <span class="nav-text">Sessions</span>
                </a>
                <a href="/restaurants" class="nav-item" data-path="/restaurants">
                    <span class="nav-icon">🍕</span>
                    <span class="nav-text">Restaurants</span>
                </a>
                <a href="/menus" class="nav-item" data-path="/menus">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">Menus</span>
                </a>
                <a href="/analytics" class="nav-item" data-path="/analytics">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Analytics</span>
                </a>
                <a href="/kitchen" class="nav-item" data-path="/kitchen">
                    <span class="nav-icon">👨‍🍳</span>
                    <span class="nav-text">Kitchen</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-footer-text">Order Processing Agent</div>
                <div class="sidebar-footer-version">v1.0</div>
            </div>
        </aside>

        <!-- Overlay for mobile sidebar -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

        <!-- Main content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
